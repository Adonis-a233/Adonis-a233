<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Abel Song — 正在长出八只手">
  <defs>
    <linearGradient id="ti-stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181b23"/>
      <stop offset="1" stop-color="#181b23"/>
    </linearGradient>
    <filter id="ti-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#ti-stage)"/>


  <g filter="url(#ti-shadow)">
    <rect x="80" y="40" width="1040" height="400" rx="14" fill="#101217"/>

    <rect x="80" y="40" width="1040" height="38" rx="14" fill="#282c36"/>
