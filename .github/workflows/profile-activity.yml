name: Refresh profile activity
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-activity.yml'
      - 'scripts/update_activity.py'
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Render activity and language bars
        run: python scripts/update_activity.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Feed the contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Adonis-a233
          outputs: |
            assets/contribution-snake.svg?color_snake=#bba5ee&color_dots=#262c37,#244b35,#3b7546,#78aa61,#b0dc8a
      - name: Save updated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/contribution-snake.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh public contribution artwork'
          git pull --rebase origin main
          git push origin HEAD:main
